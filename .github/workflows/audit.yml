name: audit

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'Cargo.lock'
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
