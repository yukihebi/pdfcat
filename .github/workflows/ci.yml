name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  notices:
    name: THIRD-PARTY-NOTICES up to date
    runs-on: ubuntu-latest
    # cargo-about is a third-party crate; don't fail its build on warnings.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pinned so regeneration stays byte-for-byte reproducible across runs.
      - name: Install cargo-about
        run: cargo install --locked --features cli --version 0.9.0 cargo-about
      - name: Check THIRD-PARTY-NOTICES is up to date
        run: |
          cargo about generate about.hbs -o THIRD-PARTY-NOTICES
          if ! git diff --quiet -- THIRD-PARTY-NOTICES; then
            echo "::error::THIRD-PARTY-NOTICES is stale. Regenerate with 'cargo about generate about.hbs -o THIRD-PARTY-NOTICES' and commit it."
            git --no-pager diff -- THIRD-PARTY-NOTICES
            exit 1
          fi
