[package]
name = "pdfcat"
version = "1.0.1"
edition = "2024"
description = "Concatenate PDF files and extract pages, in pure Rust."
repository = "https://github.com/yukihebi/pdfcat"
license = "MIT"
readme = "README.md"

[dependencies]
# lopdf's default chrono/jiff/time date conversions are unused here, and its
# `time` impl does not compile against time 0.3.47. `rayon` is kept: it is the
# parallel fast path for xref and object stream parsing.
lopdf = { version = "0.44.0", default-features = false, features = ["rayon"] }
tempfile = "3"
thiserror = "2.0.18"
